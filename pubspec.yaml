name: corvista
description: "Corvista — AI dashcam and road-awareness companion for iPhone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  corvista_native:
    path: packages/corvista_native
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  video_player: ^2.14.1
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/benchmark/
    - assets/licenses/
