name: corvista_native
description: "Native iOS engine for Corvista: camera, Core ML inference, recording, maps, sensors and speech."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CorvistaNativePlugin
